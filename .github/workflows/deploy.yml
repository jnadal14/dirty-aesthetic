# Builds the Next.js static export and deploys it to the Cloudflare Worker
# configured in wrangler.jsonc (static assets only, custom domains attached).
#
# The checkout stays shallow. This repository carries close to a gigabyte of
# history from years of committed camera originals; fetch-depth 1 takes only
# the tip commit.
#
# Requires repo secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers"
# template) and CLOUDFLARE_ACCOUNT_ID.

name: Deploy site to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tip commit only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `next build` writes the static site to out/; postbuild adds folder
      # index pages (scripts/postbuild.mjs).
      - run: npm run build

      - run: npx -y wrangler@4.151.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
