# Builds the Next.js static export and publishes it to GitHub Pages.
#
# The checkout stays shallow. This repository carries close to a gigabyte of
# history from years of committed camera originals; the built-in Pages
# builder had to clone all of it and stopped fitting inside its 15 minute
# limit. actions/checkout with fetch-depth 1 takes only the tip commit.
#
# Requires Settings -> Pages -> Source = "GitHub Actions". The site is served
# at the custom domain root (public/CNAME), so no base path is set.

name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tip commit only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # `next build` writes the static site to out/; postbuild adds folder
      # index pages (scripts/postbuild.mjs).
      - run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
