<body class="contact-page-bg">

    <div class="brand-container">

      <a class="brand-subtitle brand-ticket" href="/#upcoming-section">

<main class="page">
  <h1 class="center reveal">Inquiries</h1>
  <p class="contact-subtitle reveal" style="--reveal-delay:.12s">We'd love to work with you.</p>
  <form class="contact-form reveal" style="--reveal-delay:.2s" action="https://formspree.io/f/xjgvzapo" method="POST">
    <label>
      <span>Name</span>
      <input type="text" name="name" required>
    </label>
    <label>
      <span>Email</span>
      <input type="email" name="email" required>
    </label>
    <label>
      <span>Subject</span>
      <input type="text" name="subject">
    </label>
    <label>
      <span>Project Start Date</span>
      <input type="date" name="project_start_date">
    </label>
    <label>
      <span>Project Details</span>
      <textarea name="project_details" rows="4" placeholder="Venue, event type, expected capacity, other acts, etc."></textarea>
    </label>
    <label>
      <span>Message</span>
      <textarea name="message" rows="4" required></textarea>
    </label>
    <button class="btn ghost" type="submit">Send Message</button>
  </form>
</main>
