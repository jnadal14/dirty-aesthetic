<meta property="og:image" content="https://www.dirtyaesthetic.com/assets/images/optimized/merch/merch-1.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="preload" as="image" type="image/webp" href="assets/images/optimized/merch/merch-1.webp" fetchpriority="high">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
</head>
<body class="store-page-bg">
  <header class="site-header">
    <div class="brand-container">
      <a class="brand" href="index.html"><img src="assets/logos/DA_SPLAT/DA-OFF_WHITE.png" alt="Dirty Aesthetic" decoding="async" width="120" height="120"></a>
    </div>
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <nav class="nav" id="nav">
      <a href="music.html">Music</a>
      <a href="watch.html">Watch</a>
      <a href="store.html">Store</a>
      <a href="epk.html">EPK</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

<main class="store-page">
  <section class="store-product">
    <div class="store-product-grid">

      <div class="store-product-visual reveal-scale">
        <div class="store-product-image" role="button" tabindex="0" aria-label="View full merch design" data-lightbox-src="assets/images/MERCH/MERCH_1.JPG">
          <div class="store-cover-glow"></div>
          <picture>
            <source type="image/webp" srcset="assets/images/optimized/merch/merch-1.webp">
            <img src="assets/images/optimized/merch/merch-1.jpg" alt="Dirty Aesthetic first merch drop" decoding="async" fetchpriority="high" width="1400" height="1414">
          </picture>
        </div>
      </div>

      <div class="store-product-panel reveal" style="--reveal-delay:.1s">
        <header class="store-product-header">
          <span class="ep-release-tag store-product-tag">Preorder</span>
          <h1 class="store-product-title">Dirty Aesthetic Tee <span class="store-price-amount">$35</span></h1>
        </header>

        <form id="merch-order-form" class="store-form contact-form" action="https://formspree.io/f/xjgvzapo" method="POST">
          <input type="hidden" name="_subject" value="New Merch Preorder Dirty Aesthetic">
          <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="store-honeypot">
          <input type="hidden" name="item" value="First Drop Tee $35">
          <input type="hidden" name="price" value="$35">

          <label class="store-sr-only" for="merch-name">Name</label>
          <input type="text" name="name" id="merch-name" placeholder="Name" required autocomplete="name">

          <label class="store-sr-only" for="merch-email">Email</label>
          <input type="email" name="email" id="merch-email" placeholder="Email" required autocomplete="email">

          <div class="store-field-row">
            <label class="store-sr-only" for="merch-size">Size</label>
            <select name="size" id="merch-size" required>
              <option value="" disabled selected>Size</option>
              <option>XS</option>
              <option>S</option>
              <option>M</option>
              <option>L</option>
              <option>XL</option>
              <option>XXL</option>
            </select>
            <label class="store-sr-only" for="merch-qty">Quantity</label>
            <input type="number" name="quantity" id="merch-qty" min="1" max="20" value="1" required aria-label="Quantity">
          </div>

          <div class="store-delivery">
            <div class="store-delivery-options">
              <label class="store-delivery-option">
                <input type="radio" name="delivery" value="Local pickup (Vancouver)" checked>
                <span>Pickup <small>Vancouver</small></span>
              </label>
              <label class="store-delivery-option">
                <input type="radio" name="delivery" value="Ship to me">
                <span>Ship</span>
              </label>
            </div>
          </div>

          <label class="store-shipping-field" id="merch-shipping-field" for="merch-address" hidden>
            <span class="store-sr-only">Shipping address</span>
            <textarea name="address" id="merch-address" rows="2" placeholder="Shipping address"></textarea>
          </label>

          <input type="hidden" name="order_csv" value="">
          <button class="btn ghost store-submit" type="submit">Preorder</button>
        </form>

        <p id="merch-order-status" class="store-order-status" role="status" hidden></p>
      </div>

    </div>
  </section>

  <div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" aria-label="Previous" style="display:none">&#8249;</button>
    <img src="" alt="Merch design">
    <button class="lightbox-nav lightbox-next" aria-label="Next" style="display:none">&#8250;</button>
  </div>
</main>
